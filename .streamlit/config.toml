[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#111827"
linkColor = "#2563EB"
borderColor = "#E5E7EB"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.65rem"
buttonRadius = "0.65rem"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
borderColor = "#E5E7EB"
