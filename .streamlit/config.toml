[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F5F3ED"
secondaryBackgroundColor = "#EAE7DE"
textColor = "#17201E"
linkColor = "#0F766E"
borderColor = "#C9CEC7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.2rem"
buttonRadius = "0.2rem"
font = "'Barlow':https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap"
headingFont = "'Archivo':https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#EEECE5"
secondaryBackgroundColor = "#E2DFD5"
borderColor = "#C9CEC7"
